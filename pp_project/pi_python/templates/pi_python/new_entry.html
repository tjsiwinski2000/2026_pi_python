{%  extends "pi_python/base.html" %}

{% block content %}

    <p><a href="{% url 'pi_python:topic' topic.id %}"> {{ topic }}</a></p>

    <p>Add a new entry:</p>

    <form action="{% url 'pi_python:new_entry' topic.id  %}" method = 'post' >
        {% csrf_token %}
        {{ form.as_div }}
        <button name = "submit">Add an entry </button>
    </form>
{% endblock content %}
